version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhik Das", email = "abhikdss98123@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.3.16",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "pydantic>=2.13.4",
